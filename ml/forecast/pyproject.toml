[project]
name = "fireseptum-forecast"
version = "0.1.0"
description = "Fire Septum: data foundation for the next-day hotspot forecaster (FIRMS archive, validation events, FWI, fire history)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
