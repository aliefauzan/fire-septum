<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("assets/fonts/inter-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 500;
        font-display: block;
        src: url("assets/fonts/inter-500.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url("assets/fonts/inter-600.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url("assets/fonts/inter-700.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F7F8FA;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F7F8FA;
      }
      #root > div[data-composition-src] { position: absolute; inset: 0; }
      /* The source clip for the motion2code rebuild is a silent, caption-free brand beat:
         the burnt-in narration captions belong to the 4:14 demo video, not to this loop. */
      #root .capwrap { display: none !important; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="19"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-02-problem"
        data-composition-id="02-problem"
        data-composition-src="compositions/02-problem.html"
        data-start="0"
        data-duration="19"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
