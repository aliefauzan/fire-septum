<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SekatApi — no record of what was forecast (motion loop)</title>
<link rel="icon" href="data:,">
<!-- Inter, subset to the exact letters this piece uses, display=block (no fallback flash) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=block&text=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz%20%C2%B7%26.," rel="stylesheet">
<style>
  /* the palette, in one place: edit these eight values to recolour the whole piece */
  :root {
    --canvas: #F7F8FA;  --surface: #FFFFFF;  --ink: #1A1A1A;  --ink2: #6B7075;
    --line:   #E0E3E6;  --line2:   #C9CED2;  --accent: #E8590C;  --ghost: #8A9096;
  }
  html, body { margin: 0; height: 100%; background: var(--canvas); overflow: hidden }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
  text { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased }
</style>
</head>
<body>
<!--
  Contract (motion2code):
  - one stage at the source resolution (viewBox 0 0 1920 1080)
  - window.anim = { tl, duration, seek(t), play(from), pause() }
  - ?t=6.5 freezes at 6.5 s, ?external=1 does not autoplay (compare.html / renderers drive it)
  - <html data-ready="1"> once fonts are loaded and the first frame is drawn
  - with no parameter: plays by itself and loops; frame(duration) === frame(0)
  Palette sampled from the source with scripts/palette.py. Flat fills only.
  Every shape is drawn around its own origin and placed by the group transform,
  so a designer can retime or restyle a single element without touching the rest.
-->
<svg id="stage" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs><clipPath id="frame"><rect width="1920" height="1080"/></clipPath></defs>
  <g clip-path="url(#frame)">
    <rect id="bg" width="1920" height="1080" fill="var(--canvas)"/>

    <!-- 0.0-1.1 s  track badge: "Climate Data & Environmental Monitoring" -->
    <g transform="translate(140 116)">
      <rect id="badgeBox" x="0.5" y="0.5" width="510.36" height="47" rx="23.5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
      <text x="25" y="31" font-size="20" font-weight="500" fill="var(--ink)">Track · Climate Data &amp; Environmental Monitoring</text>
    </g>

    <!-- 0.0-1.1 s  headline: the problem in one line -->
    <g transform="translate(140 190)">
      <text x="0" y="56" font-size="60" font-weight="700" letter-spacing="-1.32" word-spacing="2" fill="var(--ink)">Environmental data is fragmented and hard</text>
      <text x="0" y="124.39" font-size="60" font-weight="700" letter-spacing="-1.32" word-spacing="2" fill="var(--ink)">to verify.</text>
    </g>

    <!-- 0.0-1.1 s  three problem chips -->
    <g transform="translate(140 396)">
      <rect x="0.5" y="0.5" width="359" height="99" rx="13.5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
      <text x="23" y="44.1" font-size="26" font-weight="600" letter-spacing="-0.26" fill="var(--ink)">Fragmented</text>
      <text x="23" y="76" font-size="18" font-weight="400" fill="var(--ink2)">hotspots, weather, terrain, roads</text>
    </g>
    <g transform="translate(540 396)">
      <rect x="0.5" y="0.5" width="359" height="99" rx="13.5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
      <text x="23" y="44.1" font-size="26" font-weight="600" letter-spacing="-0.26" fill="var(--ink)">Hard to verify</text>
      <text x="23" y="76" font-size="18" font-weight="400" fill="var(--ink2)">no shared, checkable record</text>
    </g>
    <g transform="translate(940 396)">
      <rect x="0.5" y="0.5" width="359" height="99" rx="13.5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
      <text x="23" y="44.1" font-size="26" font-weight="600" letter-spacing="-0.26" fill="var(--ink)">Tunable after the fact</text>
      <text x="23" y="76" font-size="18" font-weight="400" fill="var(--ink2)">a hindcast can be made to look good</text>
    </g>

    <!-- the chain: hotspots -> forecast -> decision -> (nothing on record) -->
    <g transform="translate(140 560)">
      <g id="arrows" fill="none" stroke="var(--line2)" stroke-width="2">
        <line x1="262" y1="55" x2="312" y2="55"/>
        <polygon points="312,48 326,55 312,62" fill="var(--line2)" stroke="none"/>
        <line x1="582" y1="55" x2="632" y2="55"/>
        <polygon points="632,48 646,55 632,62" fill="var(--line2)" stroke="none"/>
        <line id="arrow3" x1="902" y1="55" x2="950" y2="55" stroke-dasharray="7 7"/>
        <polygon points="950,48 964,55 950,62" fill="var(--line2)" stroke="none"/>
      </g>

      <g transform="translate(0 0)">
        <g id="node1">
          <rect x="0.5" y="0.5" width="259" height="109" rx="13.5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
          <text x="130" y="63" font-size="24" font-weight="400" text-anchor="middle" fill="var(--ink)">Hotspot map</text>
        </g>
      </g>
      <g transform="translate(320 0)">
        <g id="node2">
          <rect x="0.5" y="0.5" width="259" height="109" rx="13.5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
          <text x="130" y="63" font-size="24" font-weight="400" text-anchor="middle" fill="var(--ink)">Forecast</text>
        </g>
      </g>
      <g transform="translate(640 0)">
        <g id="node3">
          <rect x="0.5" y="0.5" width="259" height="109" rx="13.5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
          <text x="130" y="63" font-size="24" font-weight="400" text-anchor="middle" fill="var(--ink)">Decision</text>
        </g>
      </g>
      <g transform="translate(960 0)">
        <g id="node4">
          <rect x="1" y="1" width="258" height="108" rx="12" fill="var(--surface)" stroke="var(--line2)" stroke-width="2" stroke-dasharray="7 7"/>
          <text x="130" y="48" font-size="24" font-weight="400" text-anchor="middle" fill="var(--ghost)">no record of what</text>
          <text x="130" y="78" font-size="24" font-weight="400" text-anchor="middle" fill="var(--ghost)">was forecast</text>
        </g>
      </g>
    </g>

    <!-- 7.1-7.8 s  the accent rule under the gap: the thing that is missing -->
    <g transform="translate(1100 686)">
      <rect id="bar" x="0" y="-1.5" width="260" height="3" fill="var(--accent)"/>
    </g>
  </g>
</svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.14.2/gsap.min.js"></script>
<script>
(() => {
const DUR = 9.6;                        // source segment length (ffprobe: 9.60 s)
// The opening frame, defined once. The last shot tweens back to exactly these values: that is the loop.
const OPEN = {
  node1: { opacity: 0, y: 16 },
  node2: { opacity: 0, y: 16 },
  node3: { opacity: 0, y: 16 },
  node4: { opacity: 0, y: 16 },
  arrow3: { strokeDashoffset: 60 },
  bar: { scaleX: 0 }
};

function setOpening() {
  gsap.set('#node1', OPEN.node1);
  gsap.set('#node2', OPEN.node2);
  gsap.set('#node3', OPEN.node3);
  gsap.set('#node4', OPEN.node4);
  gsap.set('#arrow3', OPEN.arrow3);
  gsap.set('#bar', { ...OPEN.bar, transformOrigin: '0% 50%' });
}

// ---------- one timeline = the only clock ----------
const tl = gsap.timeline({ paused: true, repeat: -1, defaults: { ease: 'power3.out' } });

function build() {
  setOpening();

  // shot 1 (1.10-2.30 s): the three steps of the chain arrive, one after the other
  tl.fromTo('#node1', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 1.1)
    .fromTo('#node2', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 1.4)
    .fromTo('#node3', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 1.7)

  // shot 2 (5.60-6.30 s): the gap. A dashed node with no record, and the dashed link that never lands
    .fromTo('#node4', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 5.6)
    .fromTo('#arrow3', { strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 0.7, ease: 'power2.out' }, 5.6)

  // shot 3 (7.10-7.80 s): the accent rule draws itself under the gap
    .fromTo('#bar', { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: 'power3.out', transformOrigin: '0% 50%' }, 7.1)

  // shot 4 (8.35-9.50 s): the return. The chain unwinds back to the opening frame.
    .to('#bar', { scaleX: 0, duration: 0.45, ease: 'power2.in', transformOrigin: '0% 50%' }, 8.35)
    .to('#node4', { opacity: 0, y: 16, duration: 0.4, ease: 'power2.in' }, 8.45)
    .to('#arrow3', { strokeDashoffset: 60, duration: 0.5, ease: 'power2.inOut' }, 8.45)
    .to('#node3', { opacity: 0, y: 16, duration: 0.35, ease: 'power2.in' }, 8.75)
    .to('#node2', { opacity: 0, y: 16, duration: 0.35, ease: 'power2.in' }, 8.95)
    .to('#node1', { opacity: 0, y: 16, duration: 0.35, ease: 'power2.in' }, 9.15)

  // hold on the opening frame for the last 0.1 s, so the wrap is invisible
    .set({}, {}, DUR);
  tl.eventCallback('onUpdate', () => draw(tl.time()));
}

function draw(t) {
  // pure function of t: nothing procedural in this piece, kept for the contract
}

window.anim = {
  tl, duration: DUR,
  seek(t) { t = Math.min(DUR, Math.max(0, t)); tl.pause(); tl.time(t, false); draw(t); },
  play(from = 0) { tl.time(from); tl.play(); },
  pause() { tl.pause(); }
};

const qs = new URLSearchParams(location.search);
const fontsReady = Promise.race([
  Promise.all([
    document.fonts.load('700 60px "Inter"', 'Environmental data is fragmented and hard'),
    document.fonts.load('600 26px "Inter"', 'Fragmented'),
    document.fonts.load('500 20px "Inter"', 'Track · Climate Data & Environmental Monitoring'),
    document.fonts.load('400 24px "Inter"', 'Hotspot map'),
    document.fonts.ready
  ]),
  new Promise(r => setTimeout(r, 4000))
]);
fontsReady.then(() => {
  build();
  anim.seek(0);
  if (qs.has('t')) anim.seek(parseFloat(qs.get('t')));
  else if (!qs.has('external')) tl.play(0);
  document.documentElement.dataset.ready = '1';
});
})();
</script>
</body>
</html>
